# Netlify build configuration for terminal.amirradjou.com (Netlify site "amirradjou-terminal").
# Kept in the repo so the deploy is reproducible and copyable.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  HUSKY = "0"

# Netlify's default type for .webmanifest is application/octet-stream.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
